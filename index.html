<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHETAK // TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col items-center justify-between p-4 overflow-hidden bg-black font-mono">
    
    <div class="matrix-bg"></div>

    <header class="w-full max-w-4xl flex justify-between items-center p-4 border-b border-green-500/30 z-10 backdrop-blur-md">
        <h1 class="text-2xl font-bold tracking-[0.3em] text-green-500 hacker-glow">
           CHETAK <span class="animate-pulse">_</span>
        </h1>
        <div id="status-indicator" class="text-[10px] font-mono text-red-500 flex items-center gap-2 border border-red-500/50 px-2 py-1">
            <span class="w-2 h-2 bg-red-500 shadow-[0_0_5px_red]"></span>
            SYSTEM_OFFLINE
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-4xl gap-6 z-10">
        
        <div class="relative group">
            <div id="listening-animation" class="absolute inset-[-20px] hidden scanner-effect"></div>
            <button id="start-btn" class="relative z-10 w-40 h-40 rounded-full border-2 border-green-500 bg-black flex items-center justify-center cursor-pointer hover:shadow-[0_0_30px_#22c55e] transition-all duration-500 core-engine focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full h-[350px]">
            <div class="bg-black/80 border border-green-500/50 p-4 rounded shadow-[inset_0_0_15px_rgba(34,197,94,0.1)] overflow-hidden flex flex-col">
                <div class="text-[10px] text-green-800 mb-2 uppercase tracking-tighter border-b border-green-900 pb-1">Primary_Input_Stream</div>
                <div id="transcript" class="text-green-400 text-sm italic mb-4 overflow-y-auto">READY_FOR_COMMAND...</div>
                
                <div class="text-[10px] text-green-800 mb-2 uppercase tracking-tighter border-b border-green-900 pb-1 mt-auto">AI_Kernel_Response</div>
                <div id="response" class="text-green-300 text-lg leading-tight font-bold">AWAITING_INITIALIZATION...</div>
            </div>

            <div class="bg-black/80 border border-green-500/50 p-4 rounded shadow-[inset_0_0_15px_rgba(34,197,94,0.1)] flex flex-col">
                <div class="text-[10px] text-green-800 mb-2 uppercase tracking-tighter border-b border-green-900 pb-1 flex justify-between">
                    <span>Encrypted_Chat_Log</span>
                    <span id="status-text">IDLE</span>
                </div>
                <div id="chat-window" class="flex-grow overflow-y-auto space-y-2 p-2 scrollbar-hacker">
                    </div>
                <button id="mic-btn" class="mt-2 border border-green-500/50 text-green-500 py-1 text-xs hover:bg-green-500/10 transition-colors">
                    ACCESS_VOICE_MODEM
                </button>
            </div>
        </div>
        

    </main>

    <footer class="w-full max-w-4xl p-4 text-center text-green-900 text-[10px] z-10">
        <div class="flex flex-wrap justify-center gap-2 opacity-50">
            <span>[SYS_LINK_ESTABLISHED]</span>
            <span>[SYLLABUS_LOADED]</span>
            <span>[ENCRYPTION_ACTIVE]</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
